<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Dash - Flappy Style</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: 'Courier New', Courier, monospace;
    }
    canvas {
      display: block;
      background: linear-gradient(to bottom, #0f0f0f, #1a1a1a);
    }
    #restartBtn {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translateX(-50%);
      padding: 20px 40px;
      background-color: #00ffcc;
      color: black;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      z-index: 10;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <button id="restartBtn">RESTART</button>  <audio id="bgMusic1" src="music1.mp3"></audio> <audio id="bgMusic2" src="music2.mp3"></audio>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const restartBtn = document.getElementById("restartBtn");
    const jumpSound = document.getElementById("jumpSound");
    const bgMusic1 = document.getElementById("bgMusic1");
    const bgMusic2 = document.getElementById("bgMusic2");
    let currentTrack = 0;

    function playNextTrack() {
      bgMusic1.pause();
      bgMusic2.pause();

      setTimeout(() => {
        if (currentTrack === 0) {
          bgMusic1.currentTime = 0;
          bgMusic1.play();
          currentTrack = 1;
        } else {
          bgMusic2.currentTime = 0;
          bgMusic2.play();
          currentTrack = 0;
        }
      }, 10000);
    }

    bgMusic1.addEventListener("ended", playNextTrack);
    bgMusic2.addEventListener("ended", playNextTrack);

    let player, gravity, lift, obstacles, powerUps, score, gameOver;

    function init() {
      player = {
        x: 100,
        y: canvas.height / 2,
        width: 40,
        height: 40,
        color: "#00ffcc",
        dy: 0,
        invincible: false,
        invincibleTimer: 0
      };

      gravity = 0.6;
      lift = -10;
      obstacles = [];
      powerUps = [];
      score = 0;
      gameOver = false;
      restartBtn.style.display = "none";

      if (bgMusic1.paused && bgMusic2.paused) {
        setTimeout(() => {
          bgMusic1.currentTime = 0;
          bgMusic1.play();
          currentTrack = 1;
        }, 3000);
      }

      update();
    }

    function drawPlayer() {
      ctx.fillStyle = player.invincible ? "#ffff00" : player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function createObstacle() {
      const size = Math.random() * 50 + 30;
      const isMoving = score > 2500 && Math.random() < 0.2;
      if (isMoving) {
        obstacles.push({
          x: canvas.width,
          y: Math.random() * (canvas.height - size),
          width: size,
          height: size,
          color: "#ff0000",
          type: "moving",
          dy: 2
        });
      } else {
        obstacles.push({
          x: canvas.width,
          y: Math.random() * (canvas.height - size),
          width: size,
          height: size,
          color: "#ff0066",
          type: "static"
        });
      }
    }

    function createPowerUp() {
      let size = 30;
      powerUps.push({
        x: canvas.width,
        y: Math.random() * (canvas.height - size),
        width: size,
        height: size,
        color: "#00ff00"
      });
    }

    function drawObstacles() {
      obstacles.forEach(obs => {
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
      });
    }

    function drawPowerUps() {
      powerUps.forEach(pu => {
        ctx.fillStyle = pu.color;
        ctx.fillRect(pu.x, pu.y, pu.width, pu.height);
      });
    }

    function update() {
      if (gameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      player.dy += gravity;
      player.y += player.dy;

      if (player.y < 0 || player.y + player.height > canvas.height) {
        gameOver = true;
        restartBtn.style.display = "block";
        bgMusic1.pause();
        bgMusic2.pause();
        return;
      }

      if (player.invincible) {
        player.invincibleTimer--;
        if (player.invincibleTimer <= 0) {
          player.invincible = false;
        }
      }

      obstacles.forEach(obs => {
        obs.x -= 4;

        if (obs.type === "moving") {
          obs.y += obs.dy;
          if (obs.y <= 0 || obs.y + obs.height >= canvas.height) {
            obs.dy *= -1;
          }
        }

        if (!player.invincible &&
            player.x < obs.x + obs.width &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.height &&
            player.y + player.height > obs.y) {
          gameOver = true;
          restartBtn.style.display = "block";
          bgMusic1.pause();
          bgMusic2.pause();
        }
      });

      powerUps.forEach(pu => {
        pu.x -= 4;

        if (
          player.x < pu.x + pu.width &&
          player.x + player.width > pu.x &&
          player.y < pu.y + pu.height &&
          player.y + player.height > pu.y
        ) {
          player.invincible = true;
          player.invincibleTimer = 200;
        }
      });

      obstacles = obstacles.filter(obs => obs.x + obs.width > 0);
      powerUps = powerUps.filter(pu => pu.x + pu.width > 0);

      drawPlayer();
      drawObstacles();
      drawPowerUps();

      ctx.fillStyle = "#fff";
      ctx.font = "24px Courier New";
      ctx.fillText("Score: " + score, 20, 30);

      score++;
      requestAnimationFrame(update);
    }

    setInterval(createObstacle, 1400);
    setInterval(createPowerUp, 8000);

    function jump() {
      if (!gameOver) {
        player.dy = lift;
        jumpSound.currentTime = 0;
        jumpSound.play();
      }
    }

    document.addEventListener("keydown", e => {
      if (e.code === "Space") {
        jump();
      }
    });

    document.addEventListener("touchstart", jump);
    document.addEventListener("mousedown", jump);

    restartBtn.addEventListener("click", init);

    init();
  </script></body>
</html>
